        extend: {

          },
          boxShadow: {
            'soft': '0 2px 8px -2px rgba(34, 32, 29, 0.05), 0 1px 3px -1px rgba(34, 32, 29, 0.03)',
            'card': '0 4px 16px -4px rgba(34, 32, 29, 0.06), 0 1px 4px -1px rgba(34, 32, 29, 0.03)',

  <style>
    body {
      background-color: #F9F8F5;
      color: #22201D;
      font-family: 'Inter', sans-serif;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D8D4CC; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #B8B3A8; }
        @keyframes tabEnter {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-tab-enter {
      animation: tabEnter 220ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fade-in {
      animation: fadeIn 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .card-interactive {
      transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 200ms cubic-bezier(0.16, 1, 0.3, 1), border-color 200ms ease-out;
      will-change: transform, box-shadow;
    }
    .card-interactive:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
    }
    .btn-interactive {
      transition: transform 120ms ease-out, background-color 150ms ease-out, box-shadow 150ms ease-out, opacity 150ms ease-out;
    }
    .btn-interactive:hover:not(:disabled) {
      transform: translateY(-1px);
    }
    .btn-interactive:active:not(:disabled) {
      transform: translateY(1px) scale(0.98);
    }
    @keyframes shieldBreathe {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.04); }
    }
    .shield-pulse-active {
      animation: shieldBreathe 2.4s ease-in-out infinite;
    }
    @keyframes quarantineGlow {
      0%, 100% {
        border-color: rgba(244, 63, 94, 0.35);
        box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.1);
      }
      50% {
        border-color: rgba(244, 63, 94, 0.65);
        box-shadow: 0 0 12px 1px rgba(244, 63, 94, 0.15);
      }
    }
    .quarantine-pulse {
      animation: quarantineGlow 3s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .card-interactive:hover { transform: none !important; }
      .btn-interactive:active, .btn-interactive:hover { transform: none !important; }
    }
  </style>
</head>

                  <div className="bg-white rounded-2xl p-6 border border-[#E8E5DF] shadow-xs">
                    <h3 className="text-xs font-bold text-stone-400 uppercase tracking-wider mb-4">Pipeline Architecture: Source → Collection → Normalization → Privacy Processing</h3>
                    <div className="flex flex-col md:flex-row items-center justify-between gap-3 text-center">
                      <div className="flex-1 w-full bg-[#FBF9F5] p-3.5 rounded-xl border border-stone-200">
                        <Server size={18} className="mx-auto text-indigo-600 mb-1" />
                        <span className="font-bold text-xs block">1. Customer Sources</span>
                        <span className="text-[10px] text-stone-500">6 Monitored</span>
                      </div>
                      <ArrowRight size={16} className="text-stone-300 hidden md:block" />
                      <div className="flex-1 w-full bg-[#FBF9F5] p-3.5 rounded-xl border border-indigo-200 bg-indigo-50/20">
                        <Cpu size={18} className="mx-auto text-indigo-600 mb-1" />
                        <span className="font-bold text-xs block">2. Collection</span>
                        <span className="text-[10px] text-stone-500">0.85ms Latency</span>
                      </div>
                      <ArrowRight size={16} className="text-stone-300 hidden md:block" />
                      <div className="flex-1 w-full bg-[#FBF9F5] p-3.5 rounded-xl border border-stone-200">
                        <Activity size={18} className="mx-auto text-purple-600 mb-1" />
                        <span className="font-bold text-xs block">3. Normalization</span>
                        <span className="text-[10px] text-stone-500">ECS Schema</span>
                      </div>
                      <ArrowRight size={16} className="text-stone-300 hidden md:block" />
                      <div className="flex-1 w-full bg-[#FBF9F5] p-3.5 rounded-xl border border-stone-200">
                        <ShieldCheck size={18} className="mx-auto text-teal-600 mb-1" />
                        <span className="font-bold text-xs block">4. Privacy Processing</span>
                        <span className="text-[10px] text-stone-500">JEV Strict</span>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 4: PRIVACY & POLICY & SANDBOX */}
              {currentTab === 'privacy' && (
                <div className="space-y-6">
                  <div className="bg-white rounded-2xl p-5 border border-[#E8E5DF] shadow-xs">
                    <h2 className="text-lg font-bold text-stone-900">Active JEV Privacy Policy: v2.1.0-strict</h2>
                    <p className="text-xs text-stone-500">Enforces field allow-lists, secret scrubbing, and HMAC pseudonymization locally.</p>
                  </div>

                  {/* Sandbox */}
                  <div className="bg-white rounded-2xl p-6 border border-[#E8E5DF] shadow-xs space-y-4">
                    <div className="flex justify-between items-center">
                      <div>
                        <h3 className="text-base font-bold text-stone-900">Policy Testing Sandbox</h3>
                        <p className="text-xs text-stone-500">Test JEV privacy decisions on sample telemetry payloads locally.</p>
                      </div>
                      <button onClick={handleRunSandbox} className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-xs">
                        Test Policy
                      </button>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                      <div>
                        <label className="text-xs font-bold text-stone-700 block mb-1">Input Telemetry (JSON)</label>
                        <textarea
                          value={sandboxInput}
                          onChange={(e) => setSandboxInput(e.target.value)}
                          rows={14}
                          className="w-full p-3 font-mono text-xs bg-stone-900 text-emerald-300 rounded-xl border border-stone-800"
                        />
                      </div>

                      <div>
                        <label className="text-xs font-bold text-stone-700 block mb-1">Sanitized Egress Output</label>
                        {!sandboxResult ? (
                          <div className="h-[295px] flex items-center justify-center p-6 text-center border border-dashed border-stone-300 rounded-xl bg-[#FBF9F5] text-stone-400 text-xs">
                            Click "Test Policy" to evaluate privacy rules.
                          </div>
                        ) : (
                          <div className="space-y-2">
                            <div className={`p-2.5 rounded-lg border text-xs font-bold ${sandboxResult.isApproved ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-rose-50 text-rose-800 border-rose-300'}`}>
                              {sandboxResult.isApproved ? '✓ APPROVED: Sanitized for Egress' : '✗ BLOCKED: Forbidden Dump'}
                            </div>
                            <pre className="p-3 bg-stone-900 text-stone-100 rounded-xl text-xs font-mono overflow-x-auto max-h-[240px]">
                              {JSON.stringify(sandboxResult.sanitized, null, 2)}
                            </pre>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 5: OUTBOUND QUEUE */}
              {currentTab === 'queue' && (
                <div className="space-y-6">
                  <div className="bg-white rounded-2xl p-5 border border-[#E8E5DF] shadow-xs flex justify-between items-center">
                    <div>
                      <h2 className="text-lg font-bold text-stone-900">Sanitized Telemetry Outbound Buffer</h2>
                      <p className="text-xs text-stone-500">Real HTTP communication with PC 2 backend at POST /api/v1/ingestion/pc1/telemetry</p>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => setSenderPaused(!senderPaused)} className={`px-4 py-2 rounded-xl text-xs font-bold shadow-xs ${senderPaused ? 'bg-emerald-600 text-white' : 'bg-stone-200 text-stone-700'}`}>
                        {senderPaused ? 'Resume Sender' : 'Pause Sender'}
                      </button>
                    </div>
                  </div>

                  {statusMessage && (
                    <div className="p-3 rounded-xl bg-indigo-50 border border-indigo-200 text-xs text-indigo-900 font-semibold flex justify-between">
                      <span>{statusMessage}</span>
                      <button onClick={() => setStatusMessage(null)}>✕</button>
                    </div>
                  )}

                  <div className="bg-white rounded-2xl border border-[#E8E5DF] overflow-hidden shadow-xs">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-[#F2EFE9] text-stone-600 font-bold uppercase text-[10px]">
                        <tr>
                          <th className="p-3">Payload ID</th>
                          <th className="p-3">Source & Events</th>
                          <th className="p-3">Tenant / Gateway</th>
                          <th className="p-3">Size</th>
                          <th className="p-3">Status</th>
                          <th className="p-3">Receipt / Error</th>
                          <th className="p-3 text-right">Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-stone-200">
                        {queue.map(item => (
                          <tr key={item.payloadId}>
                            <td className="p-3 font-mono font-bold text-stone-900">{item.payloadId}</td>
                            <td className="p-3">
                              <span className="font-semibold">{item.source}</span>
                              <span className="text-[10px] text-stone-400 block font-mono">({item.eventCount} event)</span>
                            </td>
                            <td className="p-3 text-stone-600 text-[11px]">
                              <div>{item.tenant}</div>
                              <span className="font-mono text-stone-400 text-[10px]">{item.gatewayId}</span>
                            </td>
                            <td className="p-3 font-mono">{item.payloadSizeBytes} B</td>
                            <td className="p-3"><span className="px-2 py-0.5 rounded border text-[10px] font-bold uppercase bg-stone-100">{item.queueStatus}</span></td>
                            <td className="p-3 text-xs">{item.receiptId || item.errorDetails || 'Ready for dispatch'}</td>
                            <td className="p-3 text-right">
                              <button onClick={() => handleSendPayload(item.payloadId)} className="px-3 py-1 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700">
                                Send / Retry
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* TAB 6: EGRESS PROOF */}
              {currentTab === 'egress' && (
                <div className="space-y-6">
                  <div className="bg-white rounded-2xl p-5 border border-[#E8E5DF] shadow-xs">
                    <h2 className="text-lg font-bold text-stone-900">Cryptographic Egress Audit Ledger</h2>
                    <p className="text-xs text-stone-500">SHA-256 hashes, exact byte counts, and Signed ACKs from PC 2</p>
                  </div>

                  <div className="bg-white rounded-2xl border border-[#E8E5DF] overflow-hidden shadow-xs">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-[#F2EFE9] text-stone-600 font-bold uppercase text-[10px]">
                        <tr>
                          <th className="p-3">Payload ID</th>
                          <th className="p-3">Tenant / Gateway</th>
                          <th className="p-3">Timestamp</th>
                          <th className="p-3">Size</th>
                          <th className="p-3">SHA-256 Hash</th>
                          <th className="p-3">ACK Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-stone-200">
                        {proofs.map(p => (
                          <tr key={p.payloadId}>
                            <td className="p-3 font-mono font-bold text-stone-900">{p.payloadId}</td>
                            <td className="p-3 text-stone-600 text-[11px]">{p.tenant} <span className="text-stone-400 block font-mono text-[10px]">{p.gatewayId}</span></td>
                            <td className="p-3 text-stone-600">{p.timestamp}</td>
                            <td className="p-3 font-mono">{p.payloadSizeBytes} B</td>
                            <td className="p-3 font-mono text-[11px] text-stone-600">{p.sha256Hash}</td>
                            <td className="p-3"><span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-50 text-emerald-800 border border-emerald-200">{p.receiptId}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              
              {/* TAB 7: ACTIVITY */}
              {currentTab === 'activity' && (
                <div className="space-y-6">
                  <div className="bg-white rounded-2xl p-5 border border-[#E8E5DF] shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                      <h2 className="text-lg font-bold text-stone-900 tracking-tight flex items-center gap-2">
                        <Activity size={20} className="text-indigo-600" />
                        <span>Customer Gateway Activity Feed</span>
                      </h2>
                      <p className="text-xs text-stone-500 mt-0.5">
                        Real-time audit log of local telemetry events, JEV privacy policy enforcement, and egress transmissions.
                      </p>
                    </div>
                    <span className="text-xs text-stone-500 font-medium bg-[#FBF9F5] px-3 py-1.5 rounded-xl border border-stone-200 self-start md:self-auto">
                      {activities.length} Recorded Events
                    </span>
                  </div>

                  <div className="bg-white rounded-2xl p-3 border border-[#E8E5DF] shadow-xs flex flex-wrap items-center justify-between gap-3">
                    <div className="relative flex-1 min-w-[220px] max-w-md">
                      <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" />
                      <input
                        type="text"
                        value={activitySearch}
                        onChange={(e) => setActivitySearch(e.target.value)}
                        placeholder="Search activity by title, entity, or keyword..."
                        className="w-full pl-9 pr-3 py-1.5 bg-[#F9F8F5] border border-[#E8E5DF] rounded-xl text-xs text-stone-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                      />
                    </div>
                    <select
                      value={activitySeverityFilter}
                      onChange={(e) => setActivitySeverityFilter(e.target.value)}
                      className="bg-[#F9F8F5] border border-[#E8E5DF] text-stone-700 text-xs rounded-xl px-3 py-1.5 font-medium focus:outline-none"
                    >
                      <option value="all">All Severities</option>
                      <option value="success">Success</option>
                      <option value="info">Info</option>
                      <option value="warning">Warning</option>
                      <option value="error">Error / Blocked</option>
                    </select>
                  </div>

                  <div className="bg-white rounded-2xl p-5 border border-[#E8E5DF] shadow-xs">
                    <div className="relative pl-6 space-y-6 before:content-[''] before:absolute before:left-2.5 before:top-2 before:bottom-2 before:w-0.5 before:bg-stone-200">
                      {activities
                        .filter(act => {
                          const matchesSearch = !activitySearch ||
                            act.title.toLowerCase().includes(activitySearch.toLowerCase()) ||
                            act.description.toLowerCase().includes(activitySearch.toLowerCase()) ||
                            act.entityId.toLowerCase().includes(activitySearch.toLowerCase());
                          const matchesSev = activitySeverityFilter === 'all' || act.severity === activitySeverityFilter;
                          return matchesSearch && matchesSev;
                        })
                        .map(item => (
                          <div key={item.id} className="relative group">
                            <div className="absolute -left-[27px] top-1.5 w-6 h-6 rounded-full bg-white border-2 border-stone-300 flex items-center justify-center group-hover:border-indigo-600 transition-colors shadow-2xs">
                              {item.severity === 'error' ? <ShieldAlert size={14} className="text-rose-600" /> :
                               item.severity === 'success' ? <ShieldCheck size={14} className="text-emerald-600" /> :
                               item.type === 'event_collected' ? <Server size={14} className="text-stone-600" /> :
                               <Activity size={14} className="text-indigo-600" />}
                            </div>

                            <div className="bg-[#FBF9F5] p-3.5 rounded-xl border border-stone-200/80 hover:border-indigo-200 transition-colors space-y-1.5">
                              <div className="flex items-center justify-between flex-wrap gap-2">
                                <div className="flex items-center gap-2">
                                  <h4 className="text-xs font-bold text-stone-900">{item.title}</h4>
                                  <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase border ${
                                    item.severity === 'success' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' :
                                    item.severity === 'error' ? 'bg-rose-50 text-rose-800 border-rose-200 font-bold' :
                                    item.severity === 'warning' ? 'bg-amber-50 text-amber-800 border-amber-200' :
                                    'bg-stone-100 text-stone-700 border-stone-200'
                                  }`}>
                                    {item.severity}
                                  </span>
                                </div>
                                <div className="flex items-center gap-2 text-[11px] text-stone-400 font-medium">
                                  <Clock size={12} />
                                  <span>{new Date(item.timestamp).toLocaleTimeString()}</span>
                                </div>
                              </div>
                              <p className="text-xs text-stone-600 leading-relaxed">{item.description}</p>
                              <div className="flex items-center justify-between text-[11px] text-stone-400 pt-1 border-t border-stone-200/50">
                                <span className="font-mono text-[10px]">Entity: <strong className="text-stone-700">{item.entityId}</strong></span>
                                <span className="text-[10px] bg-stone-100 px-1.5 py-0.5 rounded text-stone-500 font-mono">{item.type}</span>
                              </div>
                            </div>
                          </div>
                        ))}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 8: SETTINGS */}
              {currentTab === 'settings' && (
                <div className="space-y-6">
                  <div className="bg-white rounded-2xl p-5 border border-[#E8E5DF] shadow-xs">
                    <h2 className="text-lg font-bold text-stone-900">Gateway & Trust Boundary Configuration</h2>
                    <p className="text-xs text-stone-500">Manage PC 2 SaaS ingestion endpoints and cryptographic credentials</p>
                  </div>

                  <div className="bg-white rounded-2xl p-5 border border-[#E8E5DF] shadow-xs space-y-4">
                    <h3 className="text-xs font-bold text-stone-800 uppercase tracking-wider">PC 2 SaaS Ingestion Endpoint</h3>
                    <div className="space-y-2">
                      <label className="text-xs font-bold text-stone-700 block">Base URL (VITE_PC2_API_BASE_URL)</label>
                      <input
                        type="text"
                        value={pc2Endpoint}
                        onChange={(e) => setPc2Endpoint(e.target.value)}
                        className="w-full px-3 py-2 bg-[#F9F8F5] border border-[#E8E5DF] rounded-xl text-xs font-mono text-stone-800"
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs font-bold text-stone-700 block mb-1">Gateway ID</label>
                        <input
                          type="text"
                          value={gatewayId}
                          onChange={(e) => setGatewayId(e.target.value)}
                          className="w-full px-3 py-1.5 bg-[#F9F8F5] border border-[#E8E5DF] rounded-xl text-xs font-mono"
                        />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-stone-700 block mb-1">Tenant ID</label>
                        <input
                          type="text"
                          value={tenantId}
                          onChange={(e) => setTenantId(e.target.value)}
                          className="w-full px-3 py-1.5 bg-[#F9F8F5] border border-[#E8E5DF] rounded-xl text-xs font-mono"
                        />
                      </div>
                    </div>
                    <button onClick={handleTestConnection} className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold shadow-xs">
                      Test Connection (GET /api/v1/health)
                    </button>
                    {statusMessage && (
                      <div className="text-xs p-3 rounded-xl bg-indigo-50 border border-indigo-200 text-indigo-900">
                        {statusMessage}
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div></main>
          </div>

          {/* SLIDE-OVER DRAWER */}
          {selectedItem && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/30 backdrop-blur-xs">
              <div className="w-full max-w-xl bg-white h-full shadow-modal p-6 flex flex-col justify-between border-l border-[#E8E5DF]">
                <div>
                  <div className="flex justify-between items-center pb-4 border-b border-[#E8E5DF]">
                    <div>
                      <h3 className="font-mono text-base font-bold text-stone-900">{selectedItem.eventId}</h3>
                      <span className="text-xs text-stone-500">{selectedItem.source} / {selectedItem.service}</span>
                    </div>
                    <button onClick={() => setSelectedItem(null)} className="w-8 h-8 rounded-lg bg-stone-100 font-bold">✕</button>
                  </div>

                  <div className="my-4 space-y-3 text-xs">
                    <div className="p-3 bg-stone-50 rounded-xl border border-stone-200">
                      <span className="text-stone-400 block text-[10px] uppercase font-bold">Privacy Outcome</span>
                      <strong className="text-emerald-700 text-sm">{selectedItem.privacyOutcome}</strong>
                      <span className="block text-stone-500 mt-1">Rule: {selectedItem.policyRule}</span>
                    </div>

                    <div className="p-3 bg-stone-50 rounded-xl border border-stone-200">
                      <span className="text-stone-400 block text-[10px] uppercase font-bold">Description</span>
                      <p className="text-stone-700 mt-0.5">{selectedItem.description}</p>
                    </div>

                    <div>
                      <span className="text-stone-400 block text-[10px] uppercase font-bold mb-1">Field Decisions</span>
                      {selectedItem.fieldDecisions.map((fd, i) => (
                        <div key={i} className="p-2 rounded-lg bg-stone-50 border border-stone-200 my-1 text-[11px]">
                          <div className="font-mono font-bold text-stone-800">{fd.fieldName} → {fd.decision}</div>
                          <div className="text-stone-500">{fd.reason}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <button onClick={() => setSelectedItem(null)} className="w-full py-2 bg-stone-900 text-white rounded-xl text-xs font-bold">
                  Close
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
